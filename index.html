<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/sunflower.png"
    />

    <title>
      Frontend Mentor Challenge | Huddle landing page with single introductory
      section
    </title>

    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <img src="./images/logo.svg" alt="Huddle logo" />
      </header>
      <main>
        <section class="mock-up">
          <img src="./images/illustration-mockups.svg" alt="Site mock up" />
        </section>
        <section class="detail">
          <h1>Build The Community Your Fans Will Love</h1>
          <p>
            Huddle re-imagines the way we build communities. You have a voice,
            but so does your audience. Create connections with your users as you
            engage in genuine discussion.
          </p>
          <button>Register</button>
        </section>
      </main>
      <footer>
        <div class="social-links"></div>
        <div class="coder-detail">
          <p class="attribution">
            Challenge by
            <a
              href="https://www.frontendmentor.io/challenges/huddle-landing-page-with-a-single-introductory-section-B_2Wvxgi0"
              target="_blank"
              >Frontend Mentor</a
            >. <br />
            Coded by
            <a href="https://github.com/VangmanawKairung">Kairung Vangmanaw</a>.
          </p>
        </div>
      </footer>
    </div>
  </body>
</html>
